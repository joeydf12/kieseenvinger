<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pick a Finger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #060612;
  --glass:    rgba(255,255,255,0.04);
  --glass-b:  rgba(255,255,255,0.10);
  --border:   rgba(255,255,255,0.08);
  --accent:   #c026d3;
  --accent2:  #06b6d4;
  --accent3:  #f59e0b;
  --text:     #f0f0ff;
  --muted:    rgba(255,255,255,0.35);
  --r:        16px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  display: flex; flex-direction: column;
  height: 100dvh;
  user-select: none;
}

/* ── Animated mesh background ── */
.mesh {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  overflow: hidden;
}
.mesh::before, .mesh::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.55;
}
.mesh::before {
  width: 80vw; height: 80vw;
  background: radial-gradient(circle, #c026d320, #7c3aed18, transparent 70%);
  top: -20%; left: -20%;
  animation: meshMove1 12s ease-in-out infinite alternate;
}
.mesh::after {
  width: 70vw; height: 70vw;
  background: radial-gradient(circle, #06b6d420, #0ea5e918, transparent 70%);
  bottom: -20%; right: -20%;
  animation: meshMove2 9s ease-in-out infinite alternate;
}
@keyframes meshMove1 { to { transform: translate(15%, 10%) scale(1.1); } }
@keyframes meshMove2 { to { transform: translate(-12%, -8%) scale(1.15); } }

.mesh-orb3 {
  position: fixed; width: 50vw; height: 50vw;
  border-radius: 50%; filter: blur(90px); opacity: 0.3; pointer-events: none; z-index: 0;
  background: radial-gradient(circle, #f59e0b18, transparent 70%);
  top: 40%; left: 30%;
  animation: meshMove3 15s ease-in-out infinite alternate;
}
@keyframes meshMove3 { to { transform: translate(8%, -15%); } }

/* Subtle grid */
.grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 44px 44px;
}

/* ── Header ── */
.header {
  position: relative; z-index: 10;
  padding: 28px 28px 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.2rem, 8vw, 3rem);
  letter-spacing: 0.12em;
  line-height: 1;
  background: linear-gradient(135deg, #fff 30%, var(--accent2) 70%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(192,38,211,0.35));
}
.logo #secretBtn { cursor: default; }
.tagline {
  font-size: 0.65rem; font-weight: 500; letter-spacing: 0.25em;
  text-transform: uppercase; color: var(--muted);
}

/* ── Finger count pill ── */
.finger-count {
  position: fixed; top: 20px; right: 20px;
  background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 50px;
  padding: 6px 14px;
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); z-index: 20; opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.finger-count.visible { opacity: 1; }

/* ── Touch area ── */
.touch-area {
  flex: 1; position: relative; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.touch-zone { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }

.instruction {
  font-size: 0.7rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); transition: opacity 0.4s; pointer-events: none; position: relative; z-index: 2;
  text-align: center; padding: 0 40px;
}
.instruction.hidden { opacity: 0; }

/* ── Finger dots ── */
.finger {
  position: absolute; width: 72px; height: 72px; border-radius: 50%;
  transform: translate(-50%,-50%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.05em;
  pointer-events: none;
  animation: fingerPop 0.25s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes fingerPop {
  from { transform: translate(-50%,-50%) scale(0) rotate(-15deg); opacity: 0; }
  to   { transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 1; }
}

/* Pulse ring on each finger */
.finger::after {
  content: '';
  position: absolute; inset: -6px; border-radius: 50%;
  border: 1.5px solid currentColor; opacity: 0;
  animation: pulseRing 2s ease-out infinite;
}
@keyframes pulseRing {
  0%   { transform: scale(0.85); opacity: 0.6; }
  100% { transform: scale(1.5); opacity: 0; }
}

.finger[data-idx="0"] { background: conic-gradient(from 180deg, #a855f7, #7c3aed, #a855f7); box-shadow: 0 0 0 1px rgba(168,85,247,0.3), 0 0 40px rgba(168,85,247,0.6), inset 0 1px 0 rgba(255,255,255,0.2); color: rgba(168,85,247,0.8); }
.finger[data-idx="1"] { background: conic-gradient(from 180deg, #22d3ee, #0891b2, #22d3ee); box-shadow: 0 0 0 1px rgba(34,211,238,0.3), 0 0 40px rgba(34,211,238,0.6), inset 0 1px 0 rgba(255,255,255,0.2); color: rgba(34,211,238,0.8); }
.finger[data-idx="2"] { background: conic-gradient(from 180deg, #fb923c, #ea580c, #fb923c); box-shadow: 0 0 0 1px rgba(251,146,60,0.3), 0 0 40px rgba(251,146,60,0.6), inset 0 1px 0 rgba(255,255,255,0.2); color: rgba(251,146,60,0.8); }
.finger[data-idx="3"] { background: conic-gradient(from 180deg, #34d399, #059669, #34d399); box-shadow: 0 0 0 1px rgba(52,211,153,0.3), 0 0 40px rgba(52,211,153,0.6), inset 0 1px 0 rgba(255,255,255,0.2); color: rgba(52,211,153,0.8); }
.finger[data-idx="4"] { background: conic-gradient(from 180deg, #f472b6, #be185d, #f472b6); box-shadow: 0 0 0 1px rgba(244,114,182,0.3), 0 0 40px rgba(244,114,182,0.6), inset 0 1px 0 rgba(255,255,255,0.2); color: rgba(244,114,182,0.8); }
.finger[data-idx="5"] { background: conic-gradient(from 180deg, #facc15, #ca8a04, #facc15); box-shadow: 0 0 0 1px rgba(250,204,21,0.3), 0 0 40px rgba(250,204,21,0.6), inset 0 1px 0 rgba(255,255,255,0.2); color: rgba(250,204,21,0.8); }
.finger[data-idx="6"] { background: conic-gradient(from 180deg, #818cf8, #4f46e5, #818cf8); box-shadow: 0 0 0 1px rgba(129,140,248,0.3), 0 0 40px rgba(129,140,248,0.6), inset 0 1px 0 rgba(255,255,255,0.2); color: rgba(129,140,248,0.8); }
.finger[data-idx="7"] { background: conic-gradient(from 180deg, #f87171, #dc2626, #f87171); box-shadow: 0 0 0 1px rgba(248,113,113,0.3), 0 0 40px rgba(248,113,113,0.6), inset 0 1px 0 rgba(255,255,255,0.2); color: rgba(248,113,113,0.8); }

/* white text on all fingers */
.finger { color: #fff !important; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }

.finger.chosen {
  animation: chosenBurst 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  z-index: 20;
}
@keyframes chosenBurst {
  0%   { transform: translate(-50%,-50%) scale(1); filter: brightness(1); }
  40%  { transform: translate(-50%,-50%) scale(1.65); filter: brightness(1.6); }
  100% { transform: translate(-50%,-50%) scale(1.35); filter: brightness(1.2); }
}
.finger.eliminated { animation: elimFade 0.3s ease-out forwards; }
@keyframes elimFade { to { transform: translate(-50%,-50%) scale(0.2); opacity: 0; filter: blur(10px) saturate(0); } }

/* Winner ring */
.winner-ring {
  position: absolute; width: 116px; height: 116px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 0 30px rgba(255,255,255,0.2), inset 0 0 20px rgba(255,255,255,0.05);
  transform: translate(-50%,-50%) scale(0);
  pointer-events: none; z-index: 19;
  animation: ringAppear 0.5s 0.15s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes ringAppear { to { transform: translate(-50%,-50%) scale(1); } }

/* ── Countdown ── */
.countdown-overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  z-index: 50; pointer-events: none;
}
.countdown-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 40vw; line-height: 1;
  background: linear-gradient(135deg, #fff 0%, var(--accent2) 50%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 40px rgba(192,38,211,0.5));
  animation: countAnim 0.55s cubic-bezier(0.34,1.3,0.64,1) forwards; opacity: 0;
}
@keyframes countAnim {
  0%   { transform: scale(0.5) rotate(-8deg); opacity: 0; }
  55%  { opacity: 1; }
  100% { transform: scale(1.1) rotate(2deg); opacity: 0; }
}

/* ── Winner badge ── */
.winner-badge {
  position: fixed; bottom: 88px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--glass); backdrop-filter: blur(20px);
  border: 1px solid var(--glass-b);
  border-radius: 100px; padding: 14px 32px;
  font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.15em;
  z-index: 30; opacity: 0; pointer-events: none; white-space: nowrap;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  transition: all 0.45s cubic-bezier(0.34,1.56,0.64,1);
}
.winner-badge.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Reset button ── */
.reset-btn {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  color: #fff; border: none; border-radius: 100px;
  padding: 14px 40px;
  font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer; z-index: 30; opacity: 0; pointer-events: none;
  box-shadow: 0 8px 32px rgba(192,38,211,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.reset-btn.show { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
.reset-btn:active { transform: translateX(-50%) scale(0.96); }

/* ── Min notice ── */
.min-notice {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: var(--glass); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 18px 32px; text-align: center;
  font-size: 0.85rem; font-weight: 500; color: var(--muted);
  z-index: 30; opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.min-notice.show { opacity: 1; }

/* ── Flash ── */
.flash {
  position: fixed; inset: 0; background: white; opacity: 0; z-index: 200;
  pointer-events: none; animation: flash 0.45s ease-out forwards;
}
@keyframes flash { 0% { opacity: 0.4; } 100% { opacity: 0; } }

/* ── Particles ── */
.particle {
  position: fixed; width: 6px; height: 6px; border-radius: 50%;
  pointer-events: none; z-index: 40;
  animation: particleFly var(--dur) ease-out forwards;
}
@keyframes particleFly {
  0%   { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx),var(--ty)) scale(0); opacity: 0; }
}

/* ════════════════════════════
   SETTINGS PANEL
════════════════════════════ */
.settings-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.35s;
}
.settings-overlay.open { opacity: 1; pointer-events: all; }

.settings-panel {
  width: 100%;
  background: linear-gradient(180deg, #0e0e1f 0%, #080814 100%);
  border-top: 1px solid rgba(255,255,255,0.1);
  border-radius: 28px 28px 0 0;
  padding-bottom: 48px;
  transform: translateY(100%);
  transition: transform 0.42s cubic-bezier(0.34,1.1,0.64,1);
  max-height: 85vh; overflow-y: auto;
  -webkit-overflow-scrolling: touch; touch-action: pan-y;
}
.settings-overlay.open .settings-panel { transform: translateY(0); }

.panel-handle {
  width: 36px; height: 3px;
  background: rgba(255,255,255,0.15); border-radius: 3px;
  margin: 14px auto 0;
}

.panel-header {
  padding: 20px 24px 6px;
  display: flex; align-items: center; gap: 10px;
}
.panel-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.6rem; letter-spacing: 0.1em;
  background: linear-gradient(135deg, #fff, var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.hack-pill {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: #fff; font-size: 0.58rem; font-weight: 700;
  padding: 3px 9px; border-radius: 50px; letter-spacing: 0.12em; text-transform: uppercase;
}

.panel-desc {
  font-size: 0.78rem; color: var(--muted); line-height: 1.65;
  padding: 0 24px 22px;
}

.panel-body { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

/* Toggle card */
.toggle-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 18px; padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.toggle-card-info { flex: 1; }
.toggle-card-title {
  font-weight: 700; font-size: 0.92rem; margin-bottom: 3px;
  display: flex; align-items: center; gap: 8px;
}
.toggle-card-desc { font-size: 0.72rem; color: var(--muted); }

/* iOS-style toggle */
.toggle { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track {
  position: absolute; inset: 0; border-radius: 30px;
  background: rgba(255,255,255,0.1); cursor: pointer; transition: background 0.3s;
  border: 1px solid rgba(255,255,255,0.1);
}
.toggle input:checked + .toggle-track { background: var(--accent); border-color: var(--accent); }
.toggle-track::after {
  content: ''; position: absolute; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; top: 2px; left: 2px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.toggle input:checked + .toggle-track::after { transform: translateX(22px); }

/* Finger selector card */
.selector-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 18px; padding: 18px 20px;
  opacity: 0.35; transition: opacity 0.3s; pointer-events: none;
}
.selector-card.active { opacity: 1; pointer-events: all; }
.selector-label {
  font-size: 0.7rem; color: var(--muted); font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 14px;
}
.finger-opts { display: flex; gap: 8px; flex-wrap: wrap; }

.fopt {
  width: 44px; height: 44px; border-radius: 12px;
  background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1);
  color: var(--muted); font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.05em;
  cursor: pointer; transition: all 0.18s;
  display: flex; align-items: center; justify-content: center;
}
.fopt.sel { color: #fff; }

.fopt[data-c="0"].sel { background: rgba(168,85,247,0.2); border-color: #a855f7; box-shadow: 0 0 14px rgba(168,85,247,0.4); }
.fopt[data-c="1"].sel { background: rgba(34,211,238,0.2); border-color: #22d3ee; box-shadow: 0 0 14px rgba(34,211,238,0.4); }
.fopt[data-c="2"].sel { background: rgba(251,146,60,0.2); border-color: #fb923c; box-shadow: 0 0 14px rgba(251,146,60,0.4); }
.fopt[data-c="3"].sel { background: rgba(52,211,153,0.2); border-color: #34d399; box-shadow: 0 0 14px rgba(52,211,153,0.4); }
.fopt[data-c="4"].sel { background: rgba(244,114,182,0.2); border-color: #f472b6; box-shadow: 0 0 14px rgba(244,114,182,0.4); }
.fopt[data-c="5"].sel { background: rgba(250,204,21,0.2); border-color: #facc15; box-shadow: 0 0 14px rgba(250,204,21,0.4); }
.fopt[data-c="6"].sel { background: rgba(129,140,248,0.2); border-color: #818cf8; box-shadow: 0 0 14px rgba(129,140,248,0.4); }
.fopt[data-c="7"].sel { background: rgba(248,113,113,0.2); border-color: #f87171; box-shadow: 0 0 14px rgba(248,113,113,0.4); }

/* Close button */
.close-btn {
  margin: 18px 16px 0; width: calc(100% - 32px); display: block;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  color: #fff; border: none; border-radius: 14px; padding: 16px;
  font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.08em;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(192,38,211,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
  transition: filter 0.2s, transform 0.15s;
}
.close-btn:active { filter: brightness(0.9); transform: scale(0.98); }
</style>
</head>
<body>

<div class="mesh"></div>
<div class="mesh-orb3"></div>
<div class="grid"></div>

<div class="header">
  <div class="logo">PICK A <span id="secretBtn">F</span>INGER</div>
  <div class="tagline">Leg je vingers neer &mdash; het lot beslist</div>
</div>

<div class="finger-count" id="fingerCount"></div>

<div class="touch-area">
  <div class="instruction" id="instruction">Leg 2 – 8 vingers op het scherm</div>
  <div class="touch-zone" id="touchZone"></div>
</div>

<div class="countdown-overlay" id="countdownOverlay"></div>
<div class="winner-badge" id="winnerBadge"></div>
<button class="reset-btn" id="resetBtn">Opnieuw spelen</button>
<div class="min-notice" id="minNotice">Minimaal 2 vingers</div>

<!-- Settings -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="panel-handle"></div>
    <div class="panel-header">
      <div class="panel-title">Instellingen</div>
      <span class="hack-pill">⚡ Hacks</span>
    </div>
    <p class="panel-desc">Zet de hack aan om zelf te kiezen welke vinger wint. Niemand ziet het toch 😈</p>
    <div class="panel-body">
      <div class="toggle-card">
        <div class="toggle-card-info">
          <div class="toggle-card-title"><span>🎯</span> Hack activeren</div>
          <div class="toggle-card-desc">Kies zelf de winnende vinger</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="hackToggle">
          <div class="toggle-track"></div>
        </label>
      </div>
      <div class="selector-card" id="selectorCard">
        <div class="selector-label">Welke vinger wint?</div>
        <div class="finger-opts" id="fingerOpts"></div>
      </div>
    </div>
    <button class="close-btn" id="closePanelBtn">Klaar</button>
  </div>
</div>

<script>
// ── State ──
let touches = {}, state = 'idle', hackEnabled = false, hackTarget = 0;
let waitTimer = null, colorCounter = 0;

// ── DOM ──
const touchZone     = document.getElementById('touchZone');
const instruction   = document.getElementById('instruction');
const fingerCountEl = document.getElementById('fingerCount');
const winnerBadge   = document.getElementById('winnerBadge');
const minNotice     = document.getElementById('minNotice');
const resetBtn      = document.getElementById('resetBtn');
const settingsOverlay = document.getElementById('settingsOverlay');
const hackToggle    = document.getElementById('hackToggle');
const selectorCard  = document.getElementById('selectorCard');

// ── Finger option buttons ──
const fingerOpts = document.getElementById('fingerOpts');
for (let i = 0; i < 8; i++) {
  const b = document.createElement('button');
  b.className = 'fopt' + (i === 0 ? ' sel' : '');
  b.dataset.c = i; b.textContent = i + 1;
  b.addEventListener('click', () => selectHack(i));
  fingerOpts.appendChild(b);
}
function selectHack(i) {
  hackTarget = i;
  document.querySelectorAll('.fopt').forEach((b,idx) => b.classList.toggle('sel', idx === i));
}

hackToggle.addEventListener('change', () => {
  hackEnabled = hackToggle.checked;
  selectorCard.classList.toggle('active', hackEnabled);
});

// ── Settings ──
const openSettings  = () => settingsOverlay.classList.add('open');
const closeSettings = () => settingsOverlay.classList.remove('open');
document.getElementById('secretBtn').addEventListener('click', openSettings);
document.getElementById('closePanelBtn').addEventListener('click', closeSettings);
settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) closeSettings(); });

// ── Touch on play zone only ──
touchZone.addEventListener('touchstart',  onTouchStart, { passive: false });
touchZone.addEventListener('touchend',    onTouchEnd,   { passive: false });
touchZone.addEventListener('touchcancel', onTouchEnd,   { passive: false });
touchZone.addEventListener('touchmove',   e => e.preventDefault(), { passive: false });

function onTouchStart(e) {
  e.preventDefault();
  if (state === 'done' || state === 'countdown' || state === 'picking') return;
  for (const t of e.changedTouches) {
    if (Object.keys(touches).length >= 8) break;
    if (touches[t.identifier] !== undefined) continue;
    const ci = colorCounter++ % 8, num = Object.keys(touches).length + 1;
    const el = mkFinger(t.clientX, t.clientY, ci, num);
    touches[t.identifier] = { x: t.clientX, y: t.clientY, el, colorIdx: ci, num };
  }
  updateUI(); scheduleStart();
}

function onTouchEnd(e) {
  e.preventDefault();
  if (state === 'picking' || state === 'done') return;
  for (const t of e.changedTouches) {
    if (touches[t.identifier]) { touches[t.identifier].el.remove(); delete touches[t.identifier]; }
  }
  if (state === 'countdown') { reset(); return; }
  updateUI(); clearStart();
}

resetBtn.addEventListener('click', reset);

// ── Helpers ──
function mkFinger(x, y, ci, num) {
  const el = document.createElement('div');
  el.className = 'finger'; el.dataset.idx = ci;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.textContent = num;
  touchZone.appendChild(el);
  return el;
}

function updateUI() {
  const n = Object.keys(touches).length;
  fingerCountEl.classList.toggle('visible', n > 0);
  if (n > 0) fingerCountEl.textContent = n + (n === 1 ? ' vinger' : ' vingers');
  instruction.classList.toggle('hidden', n > 0);
}

function scheduleStart() {
  clearStart();
  if (Object.keys(touches).length < 2) return;
  waitTimer = setTimeout(() => {
    if (Object.keys(touches).length < 2) { showNotice(); return; }
    startCountdown();
  }, 800);
}
function clearStart() { if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; } }
function showNotice() {
  minNotice.classList.add('show');
  setTimeout(() => minNotice.classList.remove('show'), 1500);
}

function startCountdown() {
  state = 'countdown';
  const ov = document.getElementById('countdownOverlay');
  const nums = ['3','2','1','✦'];
  let i = 0;
  (function tick() {
    if (state !== 'countdown') return;
    ov.innerHTML = '';
    if (i >= nums.length) { startPicking(); return; }
    const n = document.createElement('div');
    n.className = 'countdown-num'; n.textContent = nums[i++];
    ov.appendChild(n); setTimeout(tick, 600);
  })();
}

function startPicking() {
  state = 'picking';
  document.getElementById('countdownOverlay').innerHTML = '';
  const ids = Object.keys(touches);
  if (!ids.length) { reset(); return; }

  const wi = hackEnabled ? Math.min(hackTarget, ids.length - 1) : Math.floor(Math.random() * ids.length);
  const winner = touches[ids[wi]];

  // Flash
  const fl = document.createElement('div'); fl.className = 'flash';
  document.body.appendChild(fl); setTimeout(() => fl.remove(), 500);

  // Eliminate
  ids.forEach((id, i) => {
    if (id !== ids[wi]) setTimeout(() => touches[id].el.classList.add('eliminated'), i * 55);
  });

  // Winner reveal
  setTimeout(() => {
    winner.el.classList.add('chosen');
    const ring = document.createElement('div'); ring.className = 'winner-ring';
    ring.style.left = winner.x + 'px'; ring.style.top = winner.y + 'px';
    touchZone.appendChild(ring);
    burst(winner.x, winner.y, winner.colorIdx);
    winnerBadge.innerHTML = `🏆 &nbsp;VINGER ${winner.num} WINT`;
    winnerBadge.classList.add('show');
    resetBtn.classList.add('show');
    state = 'done';
  }, ids.length * 55 + 200);
}

function burst(x, y, ci) {
  const cols = ['#a855f7','#22d3ee','#fb923c','#34d399','#f472b6','#facc15','#818cf8','#f87171'];
  const c = cols[ci % 8];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div'); p.className = 'particle';
    p.style.cssText = `left:${x}px;top:${y}px;background:${c};width:${4+Math.random()*6}px;height:${4+Math.random()*6}px`;
    const a = (i/28)*Math.PI*2, d = 60+Math.random()*160;
    p.style.setProperty('--tx', Math.cos(a)*d+'px');
    p.style.setProperty('--ty', Math.sin(a)*d+'px');
    p.style.setProperty('--dur', (0.5+Math.random()*0.6)+'s');
    document.body.appendChild(p); setTimeout(() => p.remove(), 1200);
  }
}

function reset() {
  state = 'idle'; clearStart();
  Object.values(touches).forEach(t => t.el.remove());
  touches = {}; colorCounter = 0;
  document.querySelectorAll('.winner-ring').forEach(e => e.remove());
  winnerBadge.classList.remove('show');
  resetBtn.classList.remove('show');
  fingerCountEl.classList.remove('visible');
  instruction.classList.remove('hidden');
  document.getElementById('countdownOverlay').innerHTML = '';
}

// ── Mouse (desktop) ──
let mouseDown = false;
touchZone.addEventListener('mousedown', e => {
  if (state === 'done' || state === 'countdown' || state === 'picking') return;
  mouseDown = true;
  if (Object.keys(touches).length < 8 && touches['m'] === undefined) {
    const ci = colorCounter++ % 8, num = Object.keys(touches).length + 1;
    touches['m'] = { x:e.clientX, y:e.clientY, el:mkFinger(e.clientX,e.clientY,ci,num), colorIdx:ci, num };
    updateUI(); scheduleStart();
  }
});
document.addEventListener('mouseup', () => {
  if (!mouseDown) return; mouseDown = false;
  if (state === 'countdown') { reset(); return; }
  if (state === 'picking' || state === 'done') return;
  if (touches['m']) { touches['m'].el.remove(); delete touches['m']; updateUI(); clearStart(); }
});
</script>
</body>
