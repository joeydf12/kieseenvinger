<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mijnenveld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#060612; --text:#f0f0ff; --muted:rgba(255,255,255,0.35);
  --glass:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08);
  --green:#22c55e; --red:#ef4444;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif;
  display:flex; flex-direction:column; align-items:center;
  height:100dvh; user-select:none;
}
.mesh { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.mesh::before {
  content:''; position:absolute; width:80vw; height:80vw; border-radius:50%;
  background:radial-gradient(circle,#22c55e14,transparent 70%);
  filter:blur(100px); top:-20%; left:-20%;
  animation:m1 12s ease-in-out infinite alternate;
}
.mesh::after {
  content:''; position:absolute; width:70vw; height:70vw; border-radius:50%;
  background:radial-gradient(circle,#16a34a10,transparent 70%);
  filter:blur(100px); bottom:-20%; right:-20%;
  animation:m2 9s ease-in-out infinite alternate;
}
@keyframes m1 { to { transform:translate(15%,10%) scale(1.1); } }
@keyframes m2 { to { transform:translate(-12%,-8%) scale(1.15); } }
.grid {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
  background-size:44px 44px;
}

/* Header */
.header { position:relative; z-index:5; text-align:center; padding:56px 24px 0; display:flex; flex-direction:column; align-items:center; gap:4px; }
.logo {
  font-family:'Bebas Neue',sans-serif; font-size:clamp(2rem,9vw,2.8rem); letter-spacing:0.12em;
  background:linear-gradient(135deg,#fff 30%,#4ade80 65%,#22c55e 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(34,197,94,0.4));
}
.tagline { font-size:0.65rem; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); }

/* Stats bar */
.stats-bar { position:relative; z-index:5; display:flex; gap:20px; align-items:center; margin-top:16px; }
.stat { display:flex; flex-direction:column; align-items:center; gap:2px; }
.stat-num { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:0.08em; line-height:1; }
.stat-num.mines-num { color:#ef4444; filter:drop-shadow(0 0 8px rgba(239,68,68,0.5)); }
.stat-num.safe-num  { color:#22c55e; filter:drop-shadow(0 0 8px rgba(34,197,94,0.5)); }
.stat-label { font-size:0.55rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); }
.stat-divider { width:1px; height:32px; background:var(--border); }

/* Grid */
.grid-wrap { position:relative; z-index:5; flex:1; display:flex; align-items:center; justify-content:center; padding:16px; }
.mine-grid {
  display:grid; grid-template-columns:repeat(5,1fr); gap:8px;
  width:100%; max-width:360px;
}
.cell {
  aspect-ratio:1; border-radius:12px;
  background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.09);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.18s cubic-bezier(0.34,1.4,0.64,1);
  position:relative; overflow:hidden; font-family:'Bebas Neue',sans-serif; font-size:1.2rem;
}
.cell:active { transform:scale(0.92); }
.cell:hover { border-color:rgba(255,255,255,0.2); background:rgba(255,255,255,0.08); }
.cell.revealed { cursor:default; pointer-events:none; }
.cell.revealed:active { transform:none; }

/* Adjacent number colors */
.cell.n1 { color:#22c55e; border-color:rgba(34,197,94,0.25); background:rgba(34,197,94,0.06); }
.cell.n2 { color:#3b82f6; border-color:rgba(59,130,246,0.25); background:rgba(59,130,246,0.06); }
.cell.n3 { color:#f97316; border-color:rgba(249,115,22,0.25); background:rgba(249,115,22,0.06); }
.cell.n4 { color:#a855f7; border-color:rgba(168,85,247,0.25); background:rgba(168,85,247,0.06); }
.cell.n5,.cell.n6,.cell.n7,.cell.n8 { color:#ef4444; border-color:rgba(239,68,68,0.25); background:rgba(239,68,68,0.06); }
.cell.empty { background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.05); }
.cell.mine-hit { background:rgba(239,68,68,0.2); border-color:#ef4444; animation:minePop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes minePop { 0%{transform:scale(0.8);}50%{transform:scale(1.3);}100%{transform:scale(1);} }
.cell.mine-reveal { background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.3); opacity:0.6; }

/* Pop animation for safe reveal */
@keyframes cellReveal { 0%{transform:scale(0.7);opacity:0;}100%{transform:scale(1);opacity:1;} }
.cell.revealed:not(.mine-hit) { animation:cellReveal 0.2s ease-out; }

/* Overlays */
.overlay {
  position:fixed; inset:0; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; opacity:0; pointer-events:none; transition:opacity 0.4s;
  background:rgba(0,0,0,0.82); backdrop-filter:blur(12px);
}
.overlay.show { opacity:1; pointer-events:all; }
.ov-emoji { font-size:5rem; animation:ovPop 0.55s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes ovPop { from{transform:scale(0) rotate(-20deg);}to{transform:scale(1);} }
.ov-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(2.2rem,12vw,3.4rem); letter-spacing:0.1em; text-align:center; line-height:1.1; }
.ov-title.boom { color:#ef4444; filter:drop-shadow(0 0 18px rgba(239,68,68,0.7)); }
.ov-title.safe-t { color:#22c55e; filter:drop-shadow(0 0 18px rgba(34,197,94,0.7)); }
.ov-sub { font-size:0.82rem; color:rgba(255,255,255,0.5); text-align:center; max-width:260px; line-height:1.55; }
.ov-score { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:0.1em; color:var(--muted); }
.replay-btn {
  background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; border:none;
  border-radius:100px; padding:14px 42px; font-family:'DM Sans',sans-serif;
  font-weight:700; font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase;
  cursor:pointer; box-shadow:0 8px 24px rgba(239,68,68,0.4); transition:transform 0.15s;
}
.replay-btn.green { background:linear-gradient(135deg,#22c55e,#16a34a); box-shadow:0 8px 24px rgba(34,197,94,0.4); }
.replay-btn:active { transform:scale(0.96); }

/* Danger flash */
.danger-flash { position:fixed; inset:0; z-index:70; background:rgba(239,68,68,0.45); pointer-events:none; animation:dFlash 0.5s ease-out forwards; }
@keyframes dFlash { 0%{opacity:1;}100%{opacity:0;} }
@keyframes shake {
  0%,100%{transform:translate(0,0);}
  15%{transform:translate(-8px,4px);}
  30%{transform:translate(7px,-5px);}
  45%{transform:translate(-6px,5px);}
  60%{transform:translate(6px,-3px);}
}
body.shake { animation:shake 0.4s ease-out; }

/* Difficulty selector */
.diff-row {
  position:relative; z-index:5; display:flex; gap:8px; margin-top:12px;
}
.diff-btn {
  padding:6px 14px; border-radius:50px;
  background:var(--glass); border:1px solid var(--border);
  font-size:0.65rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--muted); cursor:pointer; transition:all 0.2s;
}
.diff-btn.active { background:rgba(34,197,94,0.14); border-color:rgba(34,197,94,0.5); color:#4ade80; }
.diff-btn:active { transform:scale(0.95); }
</style>
</head>
<body>
<div class="mesh"></div>
<div class="grid"></div>

<div class="header">
  <div class="logo">MIJNENVELD</div>
  <div class="tagline">Tik slim &mdash; sla de mijnen over</div>
</div>

<div class="diff-row">
  <button class="diff-btn active" data-mines="3" onclick="setDifficulty(3,this)">Makkelijk (3)</button>
  <button class="diff-btn" data-mines="5" onclick="setDifficulty(5,this)">Normaal (5)</button>
  <button class="diff-btn" data-mines="7" onclick="setDifficulty(7,this)">Zwaar (7)</button>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-num mines-num" id="minesLeft">3</div><div class="stat-label">💣 Mijnen</div></div>
  <div class="stat-divider"></div>
  <div class="stat"><div class="stat-num safe-num" id="safeLeft">17</div><div class="stat-label">✅ Veilig</div></div>
  <div class="stat-divider"></div>
  <div class="stat"><div class="stat-num" id="revealed" style="color:var(--muted)">0</div><div class="stat-label">Ontdekt</div></div>
</div>

<div class="grid-wrap">
  <div class="mine-grid" id="mineGrid"></div>
</div>

<!-- Game over -->
<div class="overlay" id="boomOverlay">
  <div class="ov-emoji">💣</div>
  <div class="ov-title boom">BOEM!</div>
  <div class="ov-sub">Je hebt een mijn geraakt. Beter geluk volgende keer!</div>
  <div class="ov-score" id="boomScore"></div>
  <button class="replay-btn" id="boomReplay">Opnieuw</button>
</div>

<!-- Win -->
<div class="overlay" id="winOverlay">
  <div class="ov-emoji">🏆</div>
  <div class="ov-title safe-t">GEWONNEN!</div>
  <div class="ov-sub">Alle veilige vakjes ontdekt. Het veld is veilig!</div>
  <button class="replay-btn green" id="winReplay">Opnieuw</button>
</div>

<script>
const ROWS = 4, COLS = 5;
let MINES = 3;
let board = [], gameOver = false, revealedCount = 0, firstTap = true;

function setDifficulty(n, btn) {
  MINES = n;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  initGame();
}

function initGame() {
  gameOver = false; revealedCount = 0; firstTap = true;
  board = Array.from({length: ROWS}, () => Array.from({length: COLS}, () => ({ mine: false, revealed: false, adjacent: 0 })));
  renderGrid();
  updateStats();
  document.getElementById('boomOverlay').classList.remove('show');
  document.getElementById('winOverlay').classList.remove('show');
}

function placeMines(safeR, safeC) {
  let placed = 0;
  while (placed < MINES) {
    const r = Math.floor(Math.random() * ROWS);
    const c = Math.floor(Math.random() * COLS);
    if (!board[r][c].mine && !(r === safeR && c === safeC)) {
      board[r][c].mine = true;
      placed++;
    }
  }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!board[r][c].mine) board[r][c].adjacent = countAdjacent(r, c);
    }
  }
}

function countAdjacent(r, c) {
  let count = 0;
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) count++;
  }
  return count;
}

function renderGrid() {
  const grid = document.getElementById('mineGrid');
  grid.innerHTML = '';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = document.createElement('button');
    cell.className = 'cell';
    cell.dataset.r = r; cell.dataset.c = c;
    cell.addEventListener('click', () => tapCell(r, c));
    grid.appendChild(cell);
  }
}

function tapCell(r, c) {
  if (gameOver || board[r][c].revealed) return;

  if (firstTap) {
    firstTap = false;
    placeMines(r, c);
    updateStats();
  }

  if (board[r][c].mine) {
    triggerMine(r, c);
    return;
  }

  floodReveal(r, c);
  updateStats();

  const totalSafe = ROWS * COLS - MINES;
  if (revealedCount >= totalSafe) triggerWin();
}

function floodReveal(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
  if (board[r][c].revealed || board[r][c].mine) return;
  board[r][c].revealed = true;
  revealedCount++;
  const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  cell.classList.add('revealed');
  const adj = board[r][c].adjacent;
  if (adj > 0) {
    cell.classList.add('n' + adj);
    cell.textContent = adj;
  } else {
    cell.classList.add('empty');
    // Flood fill neighbors
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (dr !== 0 || dc !== 0) floodReveal(r + dr, c + dc);
    }
  }
}

function triggerMine(r, c) {
  gameOver = true;
  const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  board[r][c].revealed = true;
  cell.classList.add('revealed', 'mine-hit');
  cell.textContent = '💣';

  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 400);
  const fl = document.createElement('div'); fl.className = 'danger-flash';
  document.body.appendChild(fl); setTimeout(() => fl.remove(), 600);

  // Show all other mines
  for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) {
    if (board[row][col].mine && !(row === r && col === c)) {
      const mc = document.querySelector(`.cell[data-r="${row}"][data-c="${col}"]`);
      mc.classList.add('revealed', 'mine-reveal');
      mc.textContent = '💣';
    }
  }

  document.getElementById('boomScore').textContent = `${revealedCount} van ${ROWS * COLS - MINES} vakjes veilig ontdekt`;
  setTimeout(() => document.getElementById('boomOverlay').classList.add('show'), 500);
}

function triggerWin() {
  gameOver = true;
  setTimeout(() => document.getElementById('winOverlay').classList.add('show'), 400);
}

function updateStats() {
  document.getElementById('minesLeft').textContent = MINES;
  document.getElementById('safeLeft').textContent = ROWS * COLS - MINES - revealedCount;
  document.getElementById('revealed').textContent = revealedCount;
}

document.getElementById('boomReplay').addEventListener('click', initGame);
document.getElementById('winReplay').addEventListener('click', initGame);

initGame();
</script>
</body>
</html>
